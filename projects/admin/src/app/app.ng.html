<mat-sidenav-container>
	<mat-sidenav #sidenav [fixedInViewport]="true">
		<aside
			class="flex z-50 flex-col py-8 space-y-2 h-full bg-[#faf9f6] dark:bg-stone-950"
		>
			<div class="px-8 mb-12">
				<h1
					class="font-serif text-2xl uppercase tracking-[0.2em] text-[#775a19] dark:text-[#c5a059]"
				>
					Atelier
				</h1>
				<p
					class="font-serif text-lg opacity-60 tracking-[0.02em] text-[#775a19]"
				>
					Management Portal
				</p>
			</div>
			<nav class="flex-1 space-y-1">
				<a
					class="flex items-center py-3 pl-4 ml-4 font-bold rounded-l-full transition-all duration-300 text-[#775a19] bg-[#ffffff] dark:text-[#c5a059] dark:bg-stone-900"
					routerLink="/"
					(click)="sidenav.close()"
				>
					<span
						class="mr-4 icon-[material-symbols--dashboard-outline]"
						data-icon="dashboard"
					></span>
					<span class="font-serif text-lg tracking-[0.02em]">Overview</span>
				</a>
				<a
					class="flex items-center py-3 pl-8 transition-all duration-300 text-stone-500 dark:text-stone-400 dark:hover:text-[#c5a059] hover:text-[#775a19]"
					routerLink="/wigs"
					(click)="sidenav.close()"
				>
					<span
						class="mr-4 icon-[material-symbols--content-cut]"
						data-icon="content_cut"
						>content_cut</span
					>
					<span class="font-serif text-lg tracking-[0.02em]">Products</span>
				</a>
				<a
					class="flex items-center py-3 pl-8 transition-all duration-300 text-stone-500 dark:text-stone-400 dark:hover:text-[#c5a059] hover:text-[#775a19]"
					routerLink="/orders"
					(click)="sidenav.close()"
				>
					<span
						class="mr-4 icon-[material-symbols--shopping-bag-outline]"
						data-icon="shopping_bag"
						>shopping_bag</span
					>
					<span class="font-serif text-lg tracking-[0.02em]">Orders</span>
				</a>
				<a
					class="flex items-center py-3 pl-8 transition-all duration-300 text-stone-500 dark:text-stone-400 dark:hover:text-[#c5a059] hover:text-[#775a19]"
					routerLink="/customers"
					(click)="sidenav.close()"
				>
					<span
						class="mr-4 icon-[material-symbols--group-outline]"
						data-icon="group"
						>group</span
					>
					<span class="font-serif text-lg tracking-[0.02em]">Customers</span>
				</a>
				<a
					class="flex items-center py-3 pl-8 transition-all duration-300 text-stone-500 dark:text-stone-400 dark:hover:text-[#c5a059] hover:text-[#775a19]"
					href="#"
					(click)="sidenav.close()"
				>
					<span
						class="mr-4 icon-[material-symbols--inventory-2-outline]"
						data-icon="inventory_2"
						>inventory_2</span
					>
					<span class="font-serif text-lg tracking-[0.02em]">Inventory</span>
				</a>
				<a
					class="flex items-center py-3 pl-8 transition-all duration-300 text-stone-500 dark:text-stone-400 dark:hover:text-[#c5a059] hover:text-[#775a19]"
					href="#"
				>
					<span
						class="mr-4 icon-[material-symbols--settings-outline]"
						data-icon="settings"
						>settings</span
					>
					<span class="font-serif text-lg tracking-[0.02em]">Settings</span>
				</a>
			</nav>
			<div class="px-8 mt-auto">
				<button
					class="py-4 w-full text-sm font-bold tracking-widest uppercase rounded-lg shadow-lg atelier-gradient text-on-primary font-label shadow-primary/20"
				>
					New Collection
				</button>
			</div>
		</aside>
	</mat-sidenav>
	<mat-sidenav-content>
		<main class="min-h-screen">
			<header
				class="flex sticky top-0 z-40 justify-between items-center py-6 px-12 w-full bg-[#faf9f6]/80 backdrop-blur-xl"
			>
				<span
					class="text-2xl cursor-pointer icon-[material-symbols--menu]"
					(click)="sidenav.toggle()"
				></span>
				<div class="flex gap-8 items-center">
					<div class="relative group">
						<span
							class="absolute left-4 top-1/2 -translate-y-1/2 icon-[material-symbols--search] text-outline"
							data-icon="search"
						></span>
						<input
							class="py-2.5 pr-6 pl-12 w-64 text-xs tracking-widest rounded-lg border-none transition-all focus:ring-1 bg-surface-container-high font-label focus:ring-primary"
							placeholder="SEARCH ANALYTICS..."
							type="text"
						>
					</div>
					<h2 class="font-serif text-xl tracking-tight text-primary">
						Atelier Dashboard
					</h2>
				</div>
				<div class="flex gap-6 items-center">
					<button class="transition-colors text-secondary hover:text-primary">
						<span
							class="icon-[material-symbols--notifications-outline]"
							data-icon="notifications"
						></span>
					</button>
					<button class="transition-colors text-secondary hover:text-primary">
						<span
							class="icon-[material-symbols--chat-bubble-outline]"
							data-icon="chat_bubble"
						></span>
					</button>
					<div
						class="overflow-hidden w-10 h-10 rounded-full border border-outline-variant/30"
					>
						<img
							alt="Manager Portrait"
							class="object-cover w-full h-full"
							data-alt="professional portrait of a high-end fashion brand manager with elegant lighting and soft background"
							src="https://lh3.googleusercontent.com/aida-public/AB6AXuDUT1GU_otqlkVVFt9edg1zp1fFmK9d-TF8mS5aCSb4DNIJYveXGeaZyWTNawobngk6veU092zeqlKFFcY0SBoTYTEO4qHmo_-W28LUG8cVJDYNlZw4Fl7nl1dKQtN4lXR926zdivSBiuK0bdY8-4V41xY6OWzbrlmop-KHv6ZUJoiR2Lgqji90JBCoxLFhuCAym01OEBdlV2caUpqNjONurcGufD_FEDenOnVL6dwuCZECBmLm5xtBvcrjhPmqRl42dW0YdHjpU3gI"
						>
					</div>
				</div>
			</header>
			<router-outlet />
		</main>
	</mat-sidenav-content>
</mat-sidenav-container>
