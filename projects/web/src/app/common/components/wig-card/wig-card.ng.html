<div class="flex flex-col gap-3">
  <div
    class="w-full bg-center bg-no-repeat bg-cover aspect-[3/5]"
    style=" background-image: url({{ wig().thumbnail.url }});"
  ></div>
  <div>
    <a [routerLink]="['/wig', wig().slug]" class="text-base font-medium">{{ wig().name }}</a>
    <div class="flex justify-between">
      <p class="text-sm font-normal text-primary">{{ wig().length.price | currency: 'USD' }}</p>
      @if (cart.has(wig(), wig().length) | async) {
        <span class="icon-[solar--cart-check-bold]" animate.enter="enter" role="img" aria-hidden="true"></span>
      } @else {
        <span
          class="text-lg cursor-pointer icon-[solar--cart-large-2-line-duotone]"
          role="button"
          aria-hidden="true"
          animate.leave="leave"
          (click)="addToCart()"
        ></span>
      }
    </div>
  </div>
</div>
