<div class="mx-auto max-w-6xl">
	<!-- PageHeading -->
	<div class="flex flex-wrap gap-3 justify-between items-baseline pb-8">
		<h1
			class="text-4xl font-black tracking-tighter leading-tight dark:text-gray-100 text-[#333333] min-w-72"
		>
			Your Shopping Cart
		</h1>
		<p class="text-lg text-gray-500 dark:text-gray-400">2 items</p>
	</div>
	<div class="grid grid-cols-1 gap-8 lg:grid-cols-3 xl:gap-12">
		<!-- Item List Container -->
		<div class="space-y-4 lg:col-span-2">
			<!-- List Header -->
			<div
				class="hidden grid-cols-5 gap-4 px-4 pb-2 text-sm font-medium text-gray-500 border-b border-gray-200 md:grid dark:text-gray-400 dark:border-gray-700"
			>
				<span class="col-span-2">Product</span>
				<span>Price</span>
				<span>Quantity</span>
				<span class="text-right">Total</span>
			</div>
			<!-- ListItem 1 -->
			@for (item of items(); track item.id) { <web-cart-item [item]="item" [class.*:first:border-b]="!$last" />}
			@empty {<div class="w-full text-center">Your cart is empty</div>}

			<!-- MetaText -->
			<a
				class="inline-block pt-4 text-sm font-medium leading-normal underline hover:no-underline text-primary"
				matButton
				routerLink="/shop"
				>Continue Shopping</a
			>
		</div>
		<!-- Order Summary Card -->
		<div class="lg:col-span-1">
			<div
				class="p-6 space-y-4 rounded border border-(--mat-sys-outline) text-(--mat-sys-on-surface-container-low) bg-(--mat-sys-surface-container-low) dark:bg-background-dark"
			>
				<h2
					class="pb-4 text-xl font-bold border-b border-gray-200 dark:border-gray-700"
				>
					Order Summary
				</h2>
				<div class="space-y-2 text-sm text-gray-600 dark:text-gray-300">
					<div class="flex justify-between">
						<span>Subtotal</span>
						<span>$409.00</span>
					</div>
					<div class="flex justify-between">
						<span>Estimated Shipping</span>
						<span>$15.00</span>
					</div>
					<div class="flex justify-between">
						<span>Taxes</span>
						<span>$25.56</span>
					</div>
				</div>
				<div class="pt-4 border-t border-gray-200 dark:border-gray-700">
					<div
						class="flex justify-between text-lg font-bold dark:text-gray-100 text-[#333333]"
					>
						<span>Total</span>
            <span>{{ cart.total$ | async }}</span>
					</div>
				</div>
				<a
					routerLink="/checkout"
					matButton="filled"
					class="rounded-none!"
					[disabled]="items().length < 1"
					>Proceed to Checkout</a
				>
			</div>
		</div>
	</div>
</div>
